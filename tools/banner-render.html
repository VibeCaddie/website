<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:400px;background:#0a0c0b;overflow:hidden;
    font-family:'Sora',system-ui,sans-serif;color:#e6eae7}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 65% 80% at 26% 50%,#000 20%,transparent 100%)}
  .pad{position:relative;height:400px;padding:0 72px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box}
  .mark{width:30px;height:30px;border-radius:9px;background:#4ade80;position:relative;display:inline-block;vertical-align:middle}
  .mark::after{content:'';position:absolute;left:12px;top:5px;width:6px;height:20px;background:#0a0c0b;border-radius:3px;transform:rotate(20deg)}
  .name{font-size:22px;font-weight:600;margin-left:12px;vertical-align:middle}
  h1{margin:22px 0 0;font-size:52px;line-height:1.05;letter-spacing:-.035em;font-weight:600}
  h1 em{font-style:normal;color:#4ade80}
  p{margin:18px 0 0;font-size:19px;color:#9aa39d;max-width:560px;line-height:1.45}
  .tag{margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#6b746e}
  .tag b{color:#fbbf24;font-weight:400}
  svg{height:300px;width:auto}
</style>
